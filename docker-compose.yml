services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remover}
      POSTGRES_DB: ${POSTGRES_DB:-remover}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
